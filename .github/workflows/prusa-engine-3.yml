name: Build PrusaSlicer 3.0.0-alpha11 Android

on:
  push:
    branches: [ 'feature/prusa-engine-android', 'main' ]
    paths:
      - '.github/workflows/prusa-engine-3.yml'
      - 'scripts/build-prusa-engine-android-3.sh'
  workflow_dispatch:
    inputs:
      abi:
        description: 'Android ABI'
        type: choice
        default: arm64-v8a
        options: [ arm64-v8a, x86_64 ]

jobs:
  build-prusa3:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a ]  # x86_64 dropped: device validation covers the shipped ABI
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-sdk
      - name: Install Android NDK and native tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl tar perl python3 autoconf automake libtool m4 make ccache
          echo ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          echo ANDROID_HOME=$ANDROID_HOME
      # Reuse the (slow, ~50 min) dependency chain across runs. The hash of the
      # script that defines the deps is part of the key, and there is no
      # restore-keys fallback on purpose: a prefix match would restore exactly the
      # bundle a changed deps part is supposed to invalidate. A deps change costs
      # one full rebuild, which is what the -vN bump used to be for; -vN stays for
      # changes to the cached layout itself.
      # ccache keeps the (long) main-build compiles across runs even though the
      # checked-out sources always have fresh timestamps.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: prusa3-ccache-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: |
            prusa3-ccache-${{ matrix.abi }}-
      - name: Restore PrusaSlicer deps bundle
        uses: actions/cache@v4
        with:
          path: |
            prusa3-build/build/deps/destdir
            prusa3-build/build/deps/builds
            prusa3-build/build/deps/dep_*
          key: prusa3-deps-${{ matrix.abi }}-alpha11-v2-${{ hashFiles('scripts/build-prusa-engine-android-3.sh') }}
      - name: Build PrusaSlicer 3.0.0-alpha11 console for ${{ matrix.abi }}
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_COMPRESS: "true"
          CCACHE_MAXSIZE: 4G
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x scripts/build-prusa-engine-android-3.sh
          set -o pipefail
          scripts/build-prusa-engine-android-3.sh 2>&1 | tee prusa3-build.log
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: prusa3-ccache-${{ matrix.abi }}-${{ github.run_id }}
      - name: Save PrusaSlicer deps bundle
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            prusa3-build/build/deps/destdir
            prusa3-build/build/deps/builds
            prusa3-build/build/deps/dep_*
          key: prusa3-deps-${{ matrix.abi }}-alpha11-v2-${{ hashFiles('scripts/build-prusa-engine-android-3.sh') }}
      - name: Upload PrusaSlicer 3.0.0-alpha11 Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-3.0.0-alpha11-android-${{ matrix.abi }}
          if-no-files-found: ignore
          path: |
            prusa3-build/out/**
            prusa3-build.log
