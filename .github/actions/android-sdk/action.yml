name: Android SDK
description: >-
  Point the job at the Android SDK the runner image already provides, accept its licences and
  put its tools on PATH.

  This replaces android-actions/setup-android, which fails on current runner images: its first
  act is to install the legacy "tools" package, and the cmdline-tools repository no longer
  carries one, so sdkmanager exits 1 with "Failed to find package 'tools'" before any of the
  job's own steps run.

runs:
  using: composite
  steps:
    - name: Locate the SDK, pin the NDK, accept licences
      shell: bash
      run: |
        set -euo pipefail
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        if [ ! -d "$sdk" ]; then
          echo "No Android SDK at $sdk" >&2
          exit 1
        fi

        cmdline_tools=""
        if [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
          cmdline_tools="$sdk/cmdline-tools/latest/bin"
        else
          cmdline_tools="$(ls -d "$sdk"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
        fi
        if [ -z "$cmdline_tools" ] || [ ! -x "$cmdline_tools/sdkmanager" ]; then
          echo "sdkmanager not found under $sdk/cmdline-tools" >&2
          exit 1
        fi
        echo "using sdkmanager from $cmdline_tools"

        {
          echo "ANDROID_HOME=$sdk"
          echo "ANDROID_SDK_ROOT=$sdk"
        } >> "$GITHUB_ENV"

        for dir in "$cmdline_tools" "$sdk/platform-tools"; do
          if [ -d "$dir" ]; then
            echo "$dir" >> "$GITHUB_PATH"
          fi
        done

        # The image's own ANDROID_NDK_HOME points at its default NDK; every build here pins
        # 28.2.13676358, and the scripts prefer ANDROID_NDK_HOME over anything else.
        ndk="$sdk/ndk/28.2.13676358"
        if [ -d "$ndk" ]; then
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK=$ndk"
          } >> "$GITHUB_ENV"
        else
          echo "warning: $ndk is missing; the job's own sdkmanager step installs it" >&2
        fi

        yes | "$cmdline_tools/sdkmanager" --licenses > /dev/null || true
        "$cmdline_tools/sdkmanager" --version
